      - name: "11 ▸ Kotlin Codebase Integration"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/mp3engine/NativeEngine.kt
          package com.zatomic.mp3engine
          import java.nio.ByteBuffer

          object NativeEngine {
              init { System.loadLibrary("torchengine") }
              external fun initEngine(sampleRate: Int)
              external fun setMode(mode: Int)
              external fun resetPlayback()
              external fun processAudioBuffer(buffer: ByteBuffer, numFrames: Int)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/zatomic/mp3engine/TorchAudioProcessor.kt
          package com.zatomic.mp3engine

          import androidx.media3.common.audio.AudioProcessor.AudioFormat
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class TorchAudioProcessor : BaseAudioProcessor() {
              override fun onConfigure(inputAudioFormat: AudioFormat): AudioFormat {
                  NativeEngine.initEngine(inputAudioFormat.sampleRate)
                  return inputAudioFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val remaining = inputBuffer.remaining()
                  if (remaining == 0) return
                  val outputBuffer = replaceOutputBuffer(remaining)
                  if (inputBuffer.isDirect) {
                      val numFrames = remaining / (inputAudioFormat.channelCount * 4)
                      NativeEngine.processAudioBuffer(inputBuffer, numFrames)
                      outputBuffer.put(inputBuffer)
                  } else {
                      val bytes = ByteArray(remaining)
                      inputBuffer.get(bytes)
                      val directBuffer = ByteBuffer.allocateDirect(remaining).order(ByteOrder.nativeOrder())
                      directBuffer.put(bytes)
                      directBuffer.flip()
                      val numFrames = remaining / (inputAudioFormat.channelCount * 4)
                      NativeEngine.processAudioBuffer(directBuffer, numFrames)
                      outputBuffer.put(directBuffer)
                  }
                  outputBuffer.flip()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/zatomic/mp3engine/PlaybackService.kt
          package com.zatomic.mp3engine

          import android.content.Context
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null
              override fun onCreate() {
                  super.onCreate()
                  val audioProcessor = TorchAudioProcessor()
                  
                  val renderersFactory = object : DefaultRenderersFactory(this) {
                      override fun buildAudioSink(
                          context: Context,
                          enableFloatOutput: Boolean,
                          enableAudioTrackPlaybackParams: Boolean
                      ): AudioSink? {
                          return DefaultAudioSink.Builder(context)
                              .setAudioProcessors(arrayOf(audioProcessor))
                              .build()
                      }
                  }

                  val player = ExoPlayer.Builder(this)
                      .setRenderersFactory(renderersFactory)
                      .build()
                      
                  mediaSession = MediaSession.Builder(this, player).build()
              }
              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = mediaSession
              override fun onDestroy() {
                  mediaSession?.player?.release()
                  mediaSession?.release()
                  mediaSession = null
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/zatomic/mp3engine/AudioAdapter.kt
          package com.zatomic.mp3engine
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.zatomic.mp3engine.R

          data class AudioItem(val path: String, val name: String, val folder: String)

          class AudioAdapter(private var fullList: List<AudioItem>, val onClick: (AudioItem) -> Unit) : RecyclerView.Adapter<AudioAdapter.VH>() {
              private var filteredList = fullList.toList()

              class VH(v: View): RecyclerView.ViewHolder(v) {
                  val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                  val tvFolder: TextView = v.findViewById(R.id.tvFolder)
              }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = VH(LayoutInflater.from(parent.context).inflate(R.layout.item_audio, parent, false))
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val item = filteredList[position]
                  holder.tvTitle.text = item.name
                  holder.tvFolder.text = item.folder
                  holder.itemView.setOnClickListener { onClick(item) }
              }
              override fun getItemCount() = filteredList.size

              fun filter(query: String) {
                  filteredList = if (query.isEmpty()) fullList else fullList.filter { it.name.contains(query, ignoreCase = true) }
                  notifyDataSetChanged()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/zatomic/mp3engine/MainActivity.kt
          package com.zatomic.mp3engine

          import android.Manifest
          import android.content.ComponentName
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Button
          import android.widget.ImageButton
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SearchView
          import androidx.core.content.ContextCompat
          import androidx.core.view.GravityCompat
          import androidx.drawerlayout.widget.DrawerLayout
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.navigation.NavigationView
          import com.google.common.util.concurrent.MoreExecutors
          import com.zatomic.mp3engine.R

          class MainActivity : AppCompatActivity() {

              private var mediaController: MediaController? = null
              private lateinit var adapter: AudioAdapter
              private lateinit var drawerLayout: DrawerLayout

              private val reqPerm = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  if (it.values.any { granted -> granted }) loadAudioFiles()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  drawerLayout = findViewById(R.id.drawerLayout)
                  findViewById<Button>(R.id.btnZMenu).setOnClickListener { 
                      drawerLayout.openDrawer(GravityCompat.START) 
                  }

                  val navView = findViewById<NavigationView>(R.id.navView)
                  navView.setNavigationItemSelectedListener { item ->
                      when (item.itemId) {
                          R.id.mode_flood -> { NativeEngine.setMode(2); Toast.makeText(this,"Flood Mode Selected", Toast.LENGTH_SHORT).show() }
                          R.id.mode_torch -> { NativeEngine.setMode(1); Toast.makeText(this,"Torch Mode Selected", Toast.LENGTH_SHORT).show() }
                          R.id.mode_spot  -> { NativeEngine.setMode(0); Toast.makeText(this,"Spot Mode Selected", Toast.LENGTH_SHORT).show() }
                      }
                      drawerLayout.closeDrawer(GravityCompat.START)
                      true
                  }

                  setupMediaController()
                  checkPermissions()
              }

              private fun setupMediaController() {
                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  val controllerFuture = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture.addListener({
                      mediaController = controllerFuture.get()
                      mediaController?.addListener(object : Player.Listener {
                          override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                              findViewById<TextView>(R.id.tvCurrentTitle).text = mediaItem?.mediaMetadata?.title ?: "Unknown Track"
                          }
                      })
                  }, MoreExecutors.directExecutor())

                  findViewById<ImageButton>(R.id.btnPlayPause).setOnClickListener {
                      mediaController?.let { if (it.isPlaying) it.pause() else it.play() }
                  }
              }

              private fun checkPermissions() {
                  val permissions = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.READ_MEDIA_AUDIO)
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  
                  if (permissions.all { ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED }) {
                      loadAudioFiles()
                  } else {
                      reqPerm.launch(permissions.toTypedArray())
                  }
              }

              private fun loadAudioFiles() {
                  val audioList = mutableListOf<AudioItem>()
                  val proj = arrayOf(MediaStore.Audio.Media.DATA, MediaStore.Audio.Media.DISPLAY_NAME, MediaStore.Audio.Media.BUCKET_DISPLAY_NAME)
                  contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj, null, null, MediaStore.Audio.Media.DATE_ADDED + " DESC")?.use { cursor ->
                      while (cursor.moveToNext()) {
                          audioList.add(AudioItem(cursor.getString(0) ?: "", cursor.getString(1) ?: "Unknown Track", cursor.getString(2) ?: "Storage"))
                      }
                  }

                  adapter = AudioAdapter(audioList) { item ->
                      NativeEngine.resetPlayback()
                      mediaController?.setMediaItem(MediaItem.fromUri(item.path))
                      mediaController?.prepare()
                      mediaController?.play()
                      findViewById<TextView>(R.id.tvCurrentTitle).text = item.name
                      findViewById<TextView>(R.id.tvCurrentArtist).text = item.folder
                  }

                  val rv = findViewById<RecyclerView>(R.id.rvAudio)
                  rv.layoutManager = LinearLayoutManager(this)
                  rv.adapter = adapter

                  findViewById<SearchView>(R.id.searchView).setOnQueryTextListener(object : SearchView.OnQueryTextListener {
                      override fun onQueryTextSubmit(query: String?) = false
                      override fun onQueryTextChange(newText: String?): Boolean {
                          adapter.filter(newText ?: "")
                          return true
                      }
                  })
              }
          }
          EOF

      - name: "12 ▸ Setup Gradle"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: "13 ▸ Build Updated Production APK"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: "14 ▸ Upload Premium APK"
        uses: actions/upload-artifact@v4
        with:
          name: "ZPlus-SamsungEdition-WithMenu-V3"
          path: app/build/outputs/apk/debug/app-debug.apk

