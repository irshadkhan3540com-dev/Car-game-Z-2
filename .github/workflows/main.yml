              <string name="btn_mute_on">🔇 म्यूट</string>
              <string name="btn_speaker">🔈 स्पीकर</string>
              <string name="btn_speaker_on">🔉 स्पीकर ऑन</string>
              <string name="btn_speaker_off">🔈 स्पीकर ऑफ</string>
              <string name="btn_end_call">कॉल समाप्त करें</string>
              
              <string name="status_muted">माइक म्यूट हो गया</string>
              <string name="status_unmuted">माइक सक्रिय</string>
              <string name="status_speaker_on">स्पीकर ऑन</string>
              <string name="status_speaker_off">स्पीकर ऑफ</string>
              <string name="status_call_ended">कॉल ख़त्म</string>
              <string name="status_call_disconnected">कॉल समाप्त हुआ</string>
              <string name="connect_first">पहले कनेक्ट करें</string>
          </resources>
          STRINGS_EOF

      - name: 12. Create proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'PROGUARD_EOF'
          -keep class com.example.btcaller.** { *; }
          -keepclassmembers class com.example.btcaller.** { *; }
          -dontwarn com.example.btcaller.**
          
          -keep class androidx.** { *; }
          -keepclassmembers class androidx.** { *; }
          PROGUARD_EOF

      - name: 13. Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 14. Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 15. Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCaller-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

