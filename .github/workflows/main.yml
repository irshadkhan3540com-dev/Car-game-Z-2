name: "Z+ 2 Video Play Engine - Ultimate VIP Release"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Repository"
        uses: actions/checkout@v4

      - name: "Step 2: Setup Java 17 for Android Compiler"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Step 3: Auto-Accept Android SDK Licenses"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: "Step 4: Create Video Engine Directory Folders"
        run: |
          mkdir -p app/src/main/java/com/zatomic/videoengine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

      - name: "Step 5: Gradle Build System Configuration"
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ZPlus2VideoPlay"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.3.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }
          EOF
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          
          gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: "Step 6: Setup 100% Safe Vector Icon (Fix for Crash)"
        run: |
          # FIX: Hardcoded the XML vector to avoid internet download failures
          cat << 'EOF' > app/src/main/res/drawable/ic_phone_player.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF2196F3" android:pathData="M17,1H7C5.34,1 4,2.34 4,4v16c0,1.66 1.34,3 3,3h10c1.66,0 3,-1.34 3,-3V4c0,-1.66 -1.34,-3 -3,-3zM12,21c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM18,17H6V4h12v13z"/>
          </vector>
          EOF

      - name: "Step 7: App Custom UI Layout Styles"
        run: |
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z+ 2 video play</string>
              <string name="header_title">Z+ 2 video play</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="player_red">#E50914</color>
              <color name="brand_blue">#004AAD</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.VideoEngine" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/black">
              
              <LinearLayout
                  android:id="@+id/topBlueHeader"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:background="@color/brand_blue"
                  android:gravity="center"
                  android:padding="10dp"
                  android:layout_alignParentTop="true">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/header_title"
                      android:textColor="@color/white"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>
              
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/topBlueHeader"
                  android:layout_above="@id/bottomControllerBar"
                  android:layout_centerInParent="true"/>

              <LinearLayout
                  android:id="@+id/bottomControllerBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:layout_alignParentBottom="true"
                  android:background="#99000000"
                  android:padding="10dp">
                  
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="5dp">
                      <Button android:id="@+id/btnSelectMovie" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🎬 MOVIE" />
                      <Button android:id="@+id/btnAudioBoost" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🔊 BOOST" android:layout_marginHorizontal="5dp" android:backgroundTint="@color/player_red"/>
                      <Button android:id="@+id/btnFitScreen" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="📱 FIT" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <Button android:id="@+id/btnLanguage" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🌐 LANGUAGE" android:layout_marginEnd="5dp"/>
                      <Button android:id="@+id/btnBrightness" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🔆 BRIGHT: 100%" android:layout_marginStart="5dp"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage"/>
              
              <application android:label="@string/app_name" android:icon="@drawable/ic_phone_player" android:theme="@style/Theme.VideoEngine" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: "Step 8: Inject Google Media3 Core Framework"
        run: |
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.zatomic.videoengine'
              compileSdk 34
              defaultConfig { applicationId 'com.zatomic.videoengine'; minSdk 26; targetSdk 34; versionCode 4; versionName "4.0-VIP" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-session:1.3.0'
          }
          EOF

      - name: "Step 9: Write 100% Safe Kotlin Logic"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/videoengine/MainActivity.kt
          package com.zatomic.videoengine
          
          import android.content.Intent
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private var loudnessEnhancer: LoudnessEnhancer? = null
              private var isBoosted = false
              private var screenMode = 0 
              private var brightnessLevel = 1.0f

              private val videoPicker = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let {
                      val mediaItem = MediaItem.fromUri(it)
                      player?.setMediaItem(mediaItem)
                      player?.prepare()
                      player?.play()
                      
                      player?.audioSessionId?.let { sessionId ->
                          if (sessionId != C.AUDIO_SESSION_ID_UNSET) {
                              try { loudnessEnhancer = LoudnessEnhancer(sessionId) } catch (e: Exception) { e.printStackTrace() }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  checkSystemStoragePermission()

                  playerView = findViewById(R.id.playerView)
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player

                  findViewById<Button>(R.id.btnSelectMovie).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          if (Environment.isExternalStorageManager()) videoPicker.launch("video/*") else showPermissionDialog()
                      } else { videoPicker.launch("video/*") }
                  }

                  findViewById<Button>(R.id.btnAudioBoost).setOnClickListener { btn ->
                      val button = btn as Button
                      if (loudnessEnhancer != null) {
                          try {
                              if (!isBoosted) {
                                  loudnessEnhancer?.enabled = true
                                  loudnessEnhancer?.setTargetGain(5000) 
                                  isBoosted = true
                                  button.text = "🔊 500% ON"
                                  Toast.makeText(this@MainActivity, "🔥 Sound Engine Maxed!", Toast.LENGTH_SHORT).show()
                              } else {
                                  loudnessEnhancer?.setTargetGain(0)
                                  loudnessEnhancer?.enabled = false
                                  isBoosted = false
                                  button.text = "🔊 BOOST"
                              }
                          } catch (e: Exception) { Toast.makeText(this, "Limit reached.", Toast.LENGTH_SHORT).show() }
                      } else { Toast.makeText(this, "Please play a movie first!", Toast.LENGTH_SHORT).show() }
                  }

                  findViewById<Button>(R.id.btnFitScreen).setOnClickListener { btn ->
                      val button = btn as Button
                      when (screenMode) {
                          0 -> { playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM; screenMode = 1; button.text = "📱 ZOOM" }
                          1 -> { playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL; screenMode = 2; button.text = "📱 STRETCH" }
                          2 -> { playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT; screenMode = 0; button.text = "📱 FIT" }
                      }
                  }

                  // FIX: Crash Proof Language Button
                  findViewById<Button>(R.id.btnLanguage).setOnClickListener {
                      Toast.makeText(this@MainActivity, "⚙️ Click the Gear Icon on the video screen to change Audio/Language", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnBrightness).setOnClickListener { btn ->
                      val button = btn as Button
                      brightnessLevel -= 0.25f
                      if (brightnessLevel < 0.25f) brightnessLevel = 1.0f 
                      val layoutParams = window.attributes
                      layoutParams.screenBrightness = brightnessLevel
                      window.attributes = layoutParams
                      button.text = "🔆 BRIGHT: ${(brightnessLevel * 100).toInt()}%"
                  }
              }

              private fun checkSystemStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) { showPermissionDialog() }
              }

              private fun showPermissionDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("Permission Required")
                      .setMessage("Please toggle 'Allow management of all files' in the next screen to play videos.")
                      .setCancelable(false)
                      .setPositiveButton("Go To Settings") { _, _ ->
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              try {
                                  val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                  intent.data = Uri.parse(String.format("package:%s", applicationContext.packageName))
                                  startActivity(intent)
                              } catch (e: Exception) { startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)) }
                          }
                      }.show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  loudnessEnhancer?.release()
              }
          }
          EOF

      - name: "Step 10: Compile Stable Video Engine Executable Binary"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --info --stacktrace

      - name: "Step 11: Deploy Professional Target Package"
        uses: actions/upload-artifact@v4
        with:
          name: "ZPlus-2-Video-Play-Engine"
          path: app/build/outputs/apk/debug/app-debug.apk

