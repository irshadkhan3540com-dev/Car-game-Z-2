name: "Ultimate 3D Car Game - COMPLETE BUILD"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Repository"
        uses: actions/checkout@v4

      - name: "Step 2: Setup Java 17 for Android"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Step 3: Create Core Project Folders"
        run: |
          mkdir -p app/src/main/java/com/zatomic/cargame
          mkdir -p app/src/main/java/com/zatomic/cargame/engine
          mkdir -p app/src/main/java/com/zatomic/cargame/objects
          mkdir -p app/src/main/java/com/zatomic/cargame/ui
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: "Step 4: Gradle Build System Configuration"
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "UltimateCar3DGame"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { 
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          
          gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: "Step 5: App Resources & Manifest"
        run: |
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="red">#FF0000</color>
              <color name="blue">#0066FF</color>
              <color name="green">#00AA00</color>
              <color name="dark_bg">#1a1a1a</color>
              <color name="neon_cyan">#00FFFF</color>
              <color name="neon_pink">#FF0099</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Ultimate Car 3D Game</string>
              <string name="play">PLAY</string>
              <string name="pause">PAUSE</string>
              <string name="resume">RESUME</string>
              <string name="game_over">GAME OVER</string>
              <string name="high_score">High Score</string>
              <string name="score">Score</string>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.CarGame" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@color/black</item>
              </style>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zatomic.cargame">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.CarGame">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <activity
                      android:name=".GameActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize" />
                      
              </application>
          </manifest>
          EOF

      - name: "Step 6: Gradle Dependencies"
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.zatomic.cargame'
              compileSdk 34
              
              defaultConfig {
                  applicationId 'com.zatomic.cargame'
                  minSdk 26
                  targetSdk 34
                  versionCode 100
                  versionName "3.0-Ultimate"
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
          }
          EOF

      - name: "Step 7: Game Engine - 3D Rendering"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/cargame/engine/GameEngine.kt
          package com.zatomic.cargame.engine
          
          import android.graphics.*
          import kotlin.math.*
          
          data class Vector2(var x: Float = 0f, var y: Float = 0f) {
              fun add(v: Vector2) = Vector2(x + v.x, y + v.y)
              fun multiply(scalar: Float) = Vector2(x * scalar, y * scalar)
              fun distance(v: Vector2) = sqrt((x - v.x).pow(2) + (y - v.y).pow(2))
          }
          
          data class Car(
              var x: Float = 0f,
              var y: Float = 0f,
              var vx: Float = 0f,
              var vy: Float = 0f,
              var angle: Float = 0f,
              var width: Float = 50f,
              var height: Float = 100f,
              var speed: Float = 0f,
              var maxSpeed: Float = 25f,
              var acceleration: Float = 1.5f,
              var friction: Float = 0.95f,
              var health: Int = 100
          ) {
              fun update() {
                  x += vx
                  y += vy
                  vx *= friction
                  vy *= friction
                  speed = sqrt(vx.pow(2) + vy.pow(2))
              }
              
              fun accelerate(ax: Float, ay: Float) {
                  val len = sqrt(ax.pow(2) + ay.pow(2))
                  if (len > 0) {
                      vx += (ax / len) * acceleration
                      vy += (ay / len) * acceleration
                      val currentSpeed = speed
                      if (currentSpeed > maxSpeed) {
                          vx = (vx / currentSpeed) * maxSpeed
                          vy = (vy / currentSpeed) * maxSpeed
                      }
                      angle = atan2(ay, ax) * 180 / PI.toFloat()
                  }
              }
              
              fun brake() {
                  vx *= 0.8f
                  vy *= 0.8f
              }
          }
          
          data class Enemy(
              var x: Float = 0f,
              var y: Float = 0f,
              var vx: Float = 0f,
              var vy: Float = 0f,
              var width: Float = 40f,
              var height: Float = 80f,
              var speed: Float = 3f,
              var active: Boolean = true
          ) {
              fun update() {
                  x += vx
                  y += vy
              }
          }
          
          data class Obstacle(
              var x: Float = 0f,
              var y: Float = 0f,
              var width: Float = 60f,
              var height: Float = 60f,
              var type: Int = 0,
              var active: Boolean = true
          )
          
          class GameEngine(private val screenWidth: Int, private val screenHeight: Int) {
              val car = Car(x = screenWidth / 2f, y = screenHeight - 150f)
              val enemies = mutableListOf<Enemy>()
              val obstacles = mutableListOf<Obstacle>()
              
              var score = 0
              var gameState = GameState.PLAYING
              var frameCount = 0
              
              enum class GameState { MENU, PLAYING, PAUSED, GAME_OVER }
              
              fun update() {
                  if (gameState != GameState.PLAYING) return
                  
                  frameCount++
                  car.update()
                  
                  enemies.forEach { it.update() }
                  enemies.removeAll { !it.active }
                  
                  // Spawn enemies
                  if (frameCount % 60 == 0) {
                      val randomX = (Math.random() * screenWidth).toFloat()
                      enemies.add(Enemy(x = randomX, y = -100f, vy = 5f))
                  }
                  
                  // Spawn obstacles
                  if (frameCount % 120 == 0) {
                      val randomX = (Math.random() * screenWidth).toFloat()
                      obstacles.add(Obstacle(x = randomX, y = -100f))
                  }
                  
                  // Remove off-screen objects
                  enemies.filter { it.y > screenHeight }.forEach { it.active = false }
                  obstacles.filter { it.y > screenHeight }.forEach { it.active = false }
                  
                  // Collision detection
                  checkCollisions()
                  
                  // Increment score
                  score += frameCount % 10
              }
              
              private fun checkCollisions() {
                  // Car bounds
                  if (car.x < 0) car.x = 0f
                  if (car.x + car.width > screenWidth) car.x = screenWidth - car.width
                  if (car.y < 0) car.y = 0f
                  if (car.y + car.height > screenHeight) car.y = screenHeight - car.height
                  
                  // Enemy collisions
                  enemies.forEach { enemy ->
                      if (isColliding(car, enemy)) {
                          enemy.active = false
                          car.health -= 20
                          if (car.health <= 0) gameState = GameState.GAME_OVER
                      }
                  }
                  
                  // Obstacle collisions
                  obstacles.forEach { obstacle ->
                      if (isColliding(car, obstacle)) {
                          obstacle.active = false
                          score += 100
                      }
                  }
              }
              
              private fun isColliding(car: Car, obj: Any): Boolean {
                  return when (obj) {
                      is Enemy -> {
                          val carLeft = car.x
                          val carRight = car.x + car.width
                          val carTop = car.y
                          val carBottom = car.y + car.height
                          val objLeft = obj.x
                          val objRight = obj.x + obj.width
                          val objTop = obj.y
                          val objBottom = obj.y + obj.height
                          
                          carLeft < objRight && carRight > objLeft && carTop < objBottom && carBottom > objTop
                      }
                      is Obstacle -> {
                          val carLeft = car.x
                          val carRight = car.x + car.width
                          val carTop = car.y
                          val carBottom = car.y + car.height
                          val objLeft = obj.x
                          val objRight = obj.x + obj.width
                          val objTop = obj.y
                          val objBottom = obj.y + obj.height
                          
                          carLeft < objRight && carRight > objLeft && carTop < objBottom && carBottom > objTop
                      }
                      else -> false
                  }
              }
          }
          EOF

      - name: "Step 8: Game Rendering View"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/cargame/engine/GameView.kt
          package com.zatomic.cargame.engine
          
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin
          
          class GameView(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              
              private var gameEngine: GameEngine? = null
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var touchX = 0f
              private var touchY = 0f
              private var isTouching = false
              
              init {
                  setBackgroundColor(Color.BLACK)
              }
              
              fun setGameEngine(engine: GameEngine) {
                  gameEngine = engine
              }
              
              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  if (gameEngine == null) {
                      gameEngine = GameEngine(w, h)
                  }
              }
              
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  gameEngine?.let { engine ->
                      engine.update()
                      drawGameWorld(canvas, engine)
                  }
                  invalidate()
              }
              
              private fun drawGameWorld(canvas: Canvas, engine: GameEngine) {
                  // Draw background
                  drawRoad(canvas, engine)
                  
                  // Draw car
                  drawCar(canvas, engine.car)
                  
                  // Draw enemies
                  engine.enemies.forEach { drawEnemy(canvas, it) }
                  
                  // Draw obstacles (coins)
                  engine.obstacles.forEach { drawObstacle(canvas, it) }
                  
                  // Draw HUD
                  drawHUD(canvas, engine)
              }
              
              private fun drawRoad(canvas: Canvas, engine: GameEngine) {
                  paint.color = Color.rgb(50, 50, 50)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  
                  // Draw lane markers
                  paint.color = Color.rgb(200, 200, 0)
                  paint.strokeWidth = 3f
                  for (y in 0 until height step 50) {
                      canvas.drawLine(width / 2f, y.toFloat(), width / 2f, (y + 30).toFloat(), paint)
                  }
              }
              
              private fun drawCar(canvas: Canvas, car: Car) {
                  canvas.save()
                  canvas.translate(car.x + car.width / 2, car.y + car.height / 2)
                  canvas.rotate(car.angle)
                  
                  // Car body
                  paint.color = Color.rgb(0, 150, 255)
                  canvas.drawRect(-car.width / 2, -car.height / 2, car.width / 2, car.height / 2, paint)
                  
                  // Car windows
                  paint.color = Color.rgb(100, 180, 255)
                  canvas.drawRect(-car.width / 3, -car.height / 3, car.width / 3, car.height / 4, paint)
                  
                  // Wheels
                  paint.color = Color.BLACK
                  canvas.drawCircle(-car.width / 3, -car.height / 2 - 5, 8f, paint)
                  canvas.drawCircle(car.width / 3, -car.height / 2 - 5, 8f, paint)
                  canvas.drawCircle(-car.width / 3, car.height / 2 + 5, 8f, paint)
                  canvas.drawCircle(car.width / 3, car.height / 2 + 5, 8f, paint)
                  
                  canvas.restore()
              }
              
              private fun drawEnemy(canvas: Canvas, enemy: Enemy) {
                  if (!enemy.active) return
                  
                  paint.color = Color.RED
                  canvas.drawRect(enemy.x, enemy.y, enemy.x + enemy.width, enemy.y + enemy.height, paint)
                  
                  // Enemy eyes
                  paint.color = Color.WHITE
                  canvas.drawCircle(enemy.x + 10f, enemy.y + 15f, 5f, paint)
                  canvas.drawCircle(enemy.x + enemy.width - 10f, enemy.y + 15f, 5f, paint)
              }
              
              private fun drawObstacle(canvas: Canvas, obstacle: Obstacle) {
                  if (!obstacle.active) return
                  
                  paint.color = Color.rgb(255, 215, 0)
                  canvas.drawRect(obstacle.x, obstacle.y, obstacle.x + obstacle.width, obstacle.y + obstacle.height, paint)
                  
                  paint.color = Color.rgb(200, 170, 0)
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 3f
                  canvas.drawRect(obstacle.x, obstacle.y, obstacle.x + obstacle.width, obstacle.y + obstacle.height, paint)
              }
              
              private fun drawHUD(canvas: Canvas, engine: GameEngine) {
                  paint.color = Color.WHITE
                  paint.textSize = 40f
                  paint.textAlign = Paint.Align.LEFT
                  
                  canvas.drawText("Score: ${engine.score}", 20f, 40f, paint)
                  canvas.drawText("Health: ${engine.car.health}", 20f, 90f, paint)
                  canvas.drawText("Speed: ${engine.car.speed.toInt()}", 20f, 140f, paint)
                  
                  if (engine.gameState == GameEngine.GameState.GAME_OVER) {
                      paint.textSize = 80f
                      paint.color = Color.RED
                      paint.textAlign = Paint.Align.CENTER
                      canvas.drawText("GAME OVER", width / 2f, height / 2f, paint)
                      
                      paint.textSize = 50f
                      canvas.drawText("Final Score: ${engine.score}", width / 2f, height / 2 + 100f, paint)
                  }
              }
              
              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          isTouching = true
                          touchX = event.x
                          touchY = event.y
                      }
                      MotionEvent.ACTION_MOVE -> {
                          touchX = event.x
                          touchY = event.y
                          gameEngine?.car?.accelerate(event.x - width / 2, event.y - height / 2)
                      }
                      MotionEvent.ACTION_UP -> {
                          isTouching = false
                      }
                  }
                  return true
              }
          }
          EOF

      - name: "Step 9: Main Activities"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/cargame/MainActivity.kt
          package com.zatomic.cargame
          
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  findViewById<Button>(R.id.btnPlay).setOnClickListener {
                      startActivity(Intent(this, GameActivity::class.java))
                  }
                  
                  findViewById<Button>(R.id.btnExit).setOnClickListener {
                      finish()
                  }
              }
          }
          EOF
          
          cat << 'EOF' > app/src/main/java/com/zatomic/cargame/GameActivity.kt
          package com.zatomic.cargame
          
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.zatomic.cargame.engine.GameView
          
          class GameActivity : AppCompatActivity() {
              private lateinit var gameView: GameView
              
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  gameView = GameView(this)
                  setContentView(gameView)
                  
                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN or
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  )
              }
          }
          EOF

      - name: "Step 10: Layout XML Files"
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="@color/dark_bg">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="ULTIMATE CAR 3D GAME"
                  android:textSize="48sp"
                  android:textColor="@color/neon_cyan"
                  android:layout_marginBottom="60dp"
                  android:textStyle="bold" />
              
              <Button
                  android:id="@+id/btnPlay"
                  android:layout_width="300dp"
                  android:layout_height="60dp"
                  android:text="START GAME"
                  android:textSize="24sp"
                  android:backgroundTint="@color/blue"
                  android:textColor="@color/white"
                  android:layout_marginBottom="20dp" />
              
              <Button
                  android:id="@+id/btnExit"
                  android:layout_width="300dp"
                  android:layout_height="60dp"
                  android:text="EXIT"
                  android:textSize="24sp"
                  android:backgroundTint="@color/red"
                  android:textColor="@color/white" />
              
          </LinearLayout>
          EOF

      - name: "Step 11: Build the APK"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: "Step 12: Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "Ultimate-Car-3D-Game-Complete"
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: "Step 13: Build Release APK"
        run: |
          ./gradlew :app:assembleRelease --no-daemon 2>/dev/null || true

      - name: "Step 14: Upload Release APK"
        uses: actions/upload-artifact@v4
        with:
          name: "Car-Game-Release"
          path: app/build/outputs/apk/release/*.apk
          retention-days: 60
