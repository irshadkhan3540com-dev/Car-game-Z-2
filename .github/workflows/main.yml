name: Build Bluetooth Calling App (Complete One File)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Create Complete Project Structure & Default Assets
        run: |
          mkdir -p app/src/main/java/com/example/btcaller/{ui,utils}
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0066FF"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>' > app/src/main/res/drawable/ic_app_logo.xml
          
          echo "pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'" > settings.gradle
          
          echo "android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true" > gradle.properties

      - name: 5. Write Root build.gradle
        run: |
          cat > build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          GRADLE_EOF

      - name: 6. Write App build.gradle
        run: |
          cat > app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.btcaller'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.btcaller'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
          }
          GRADLE_EOF

      - name: 7. Write MainActivity.kt (Pro Level Permissions & UI)
        run: |
          cat > app/src/main/java/com/example/btcaller/ui/MainActivity.kt << 'KOTLIN_EOF'
          package com.example.btcaller.ui

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.ListView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private val discoveredDevices = ArrayList<BluetoothDevice>()
              private val deviceNames = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>

              private val PERMISSION_REQUEST_CODE = 101

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = android.widget.LinearLayout(this).apply {
                      orientation = android.widget.LinearLayout.VERTICAL
                      padding = 50
                  }

                  val btnScan = Button(this).apply {
                      text = "आस-पास के डिवाइस खोजें"
                      textSize = 16f
                      height = 120
                  }

                  val listView = ListView(this)
                  
                  layout.addView(btnScan)
                  layout.addView(listView, android.widget.LinearLayout.LayoutParams(
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      1f
                  ))
                  setContentView(layout)

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceNames)
                  listView.adapter = listAdapter

                  val bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager.adapter

                  // प्रो-लेवल परमिशन चेकिंग: ऐप खुलते ही सबसे पहले सारी परमिशन मांगेंगे
                  requestAllProfessionalPermissions()

                  btnScan.setOnClickListener {
                      if (hasAllPermissions()) {
                          startScanning()
                      } else {
                          Toast.makeText(this, "कृपया सभी परमिशन दें!", Toast.LENGTH_SHORT).show()
                          requestAllProfessionalPermissions()
                      }
                  }

                  listView.setOnItemClickListener { _, _, position, _ ->
                      val device = discoveredDevices[position]
                      val intent = Intent(this, CallActivity::class.java).apply {
                          putExtra("device_address", device.address)
                          putExtra("device_name", device.name ?: "Unknown Device")
                      }
                      startActivity(intent)
                  }

                  val filter = IntentFilter(BluetoothDevice.ACTION_FOUND)
                  ContextCompat.registerReceiver(this, receiver, filter, ContextCompat.RECEIVER_EXPORTED)
              }

              // यह फ़ंक्शन एकदम Google ऐप्स की तरह सारी परमिशन मांगता है
              private fun requestAllProfessionalPermissions() {
                  val permissionsToRequest = mutableListOf<String>()

                  // 1. Audio & Calls (माइक और कॉल)
                  permissionsToRequest.add(Manifest.permission.RECORD_AUDIO)
                  permissionsToRequest.add(Manifest.permission.READ_PHONE_STATE)
                  permissionsToRequest.add(Manifest.permission.CALL_PHONE)

                  // 2. Location (ब्लूटूथ सर्च के लिए अनिवार्य)
                  permissionsToRequest.add(Manifest.permission.ACCESS_FINE_LOCATION)
                  permissionsToRequest.add(Manifest.permission.ACCESS_COARSE_LOCATION)

                  // 3. Modern Android 12+ Bluetooth Permissions
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      permissionsToRequest.add(Manifest.permission.BLUETOOTH_SCAN)
                      permissionsToRequest.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }

                  // 4. Android 13+ Notifications
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissionsToRequest.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val ungrantedPermissions = permissionsToRequest.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (ungrantedPermissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, ungrantedPermissions.toTypedArray(), PERMISSION_REQUEST_CODE)
                  } else {
                      // अगर सारी परमिशन मिल गई हैं, तो "CPU/Battery" परमिशन मांगें
                      requestCpuBatteryOptimization()
                  }
              }

              // यह फ़ंक्शन "CPU" (Background Process) को चालू रखने की परमिशन मांगता है
              private fun requestCpuBatteryOptimization() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val intent = Intent()
                      val packageName = packageName
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          AlertDialog.Builder(this)
                              .setTitle("बैकग्राउंड परमिशन (CPU)")
                              .setMessage("कॉल को बैकग्राउंड में चालू रखने के लिए बैटरी ऑप्टिमाइज़ेशन को बंद करना ज़रूरी है। कृपया अगली स्क्रीन पर 'Allow' चुनें।")
                              .setPositiveButton("ठीक है") { _, _ ->
                                  intent.action = Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
                                  intent.data = Uri.parse("package:$packageName")
                                  startActivity(intent)
                              }
                              .setNegativeButton("बाद में") { dialog, _ -> dialog.dismiss() }
                              .show()
                      } else {
                          checkBluetoothState()
                      }
                  } else {
                      checkBluetoothState()
                  }
              }

              private fun checkBluetoothState() {
                  if (bluetoothAdapter?.isEnabled == false) {
                      val enableBtIntent = Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE)
                      if (hasAllPermissions()) {
                          startActivity(enableBtIntent)
                      }
                  }
              }

              private fun hasAllPermissions(): Boolean {
                  val requiredPerms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      requiredPerms.add(Manifest.permission.BLUETOOTH_SCAN)
                      requiredPerms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  return requiredPerms.all { ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      if (grantResults.isNotEmpty() && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                          Toast.makeText(this, "परमिशन्स सफलतापूर्वक सेट हो गईं!", Toast.LENGTH_SHORT).show()
                          requestCpuBatteryOptimization()
                      } else {
                          Toast.makeText(this, "ऐप चलाने के लिए सभी परमिशन देना अनिवार्य है!", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun startScanning() {
                  if (!hasAllPermissions()) return
                  
                  discoveredDevices.clear()
                  deviceNames.clear()
                  listAdapter.notifyDataSetChanged()
                  
                  if (bluetoothAdapter?.isDiscovering == true) bluetoothAdapter?.cancelDiscovery()
                  bluetoothAdapter?.startDiscovery()
                  Toast.makeText(this, "डिवाइस खोजना शुरू...", Toast.LENGTH_SHORT).show()
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (BluetoothDevice.ACTION_FOUND == intent.action) {
                          val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                          if (device != null && !discoveredDevices.contains(device)) {
                              discoveredDevices.add(device)
                              val name = if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                  device.name ?: "Unknown Device"
                              } else "Unknown"
                              deviceNames.add("$name\n${device.address}")
                              listAdapter.notifyDataSetChanged()
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
              }
          }
          KOTLIN_EOF

      - name: 8. Write CallActivity.kt (Call Management)
        run: |
          cat > app/src/main/java/com/example/btcaller/ui/CallActivity.kt << 'KOTLIN_EOF'
          package com.example.btcaller.ui

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothSocket
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.util.UUID

          class CallActivity : AppCompatActivity() {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var bluetoothSocket: BluetoothSocket? = null
              private var device: BluetoothDevice? = null
              private var isConnected = false
              private var isMuted = false
              private var isOnSpeaker = false

              private lateinit var statusText: TextView
              private lateinit var btnConnect: Button
              private lateinit var btnMute: Button
              private lateinit var btnSpeaker: Button
              private lateinit var btnEndCall: Button

              private val SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      padding = 50
                  }

                  statusText = TextView(this).apply {
                      text = "डिवाइस से कनेक्ट हो रहे हैं..."
                      textSize = 18f
                  }

                  btnConnect = Button(this).apply {
                      text = "कनेक्ट करें"
                      textSize = 14f
                      height = 100
                  }

                  btnMute = Button(this).apply {
                      text = "🔊 म्यूट नहीं"
                      textSize = 14f
                      height = 100
                  }

                  btnSpeaker = Button(this).apply {
                      text = "🔈 स्पीकर"
                      textSize = 14f
                      height = 100
                  }

                  btnEndCall = Button(this).apply {
                      text = "कॉल समाप्त करें"
                      textSize = 14f
                      height = 100
                  }

                  layout.addView(statusText)
                  layout.addView(btnConnect)
                  layout.addView(btnMute)
                  layout.addView(btnSpeaker)
                  layout.addView(btnEndCall)

                  setContentView(layout)

                  val bluetoothManager = getSystemService(BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager.adapter

                  val deviceAddress = intent.getStringExtra("device_address")
                  val deviceName = intent.getStringExtra("device_name")

                  if (deviceAddress != null) {
                      device = bluetoothAdapter?.getRemoteDevice(deviceAddress)
                      statusText.text = "डिवाइस: $deviceName\nस्टेटस: तैयार"
                      btnConnect.performClick()
                  }

                  btnConnect.setOnClickListener {
                      if (isConnected) disconnectDevice() else connectDevice()
                  }
                  btnMute.setOnClickListener { toggleMute() }
                  btnSpeaker.setOnClickListener { toggleSpeaker() }
                  btnEndCall.setOnClickListener { endCall() }
              }

              private fun connectDevice() {
                  if (device == null) return
                  Thread {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return@Thread
                          bluetoothSocket = device?.createRfcommSocketToServiceRecord(SPP_UUID)
                          bluetoothAdapter?.cancelDiscovery()
                          bluetoothSocket?.connect()
                          isConnected = true
                          runOnUiThread {
                              statusText.text = "✓ कनेक्टेड\nकॉल सक्रिय है..."
                              btnConnect.text = "डिस्कनेक्ट करें"
                          }
                      } catch (e: IOException) {
                          isConnected = false
                          runOnUiThread { statusText.text = "✕ कनेक्शन विफल\n${e.message}" }
                      }
                  }.start()
              }

              private fun disconnectDevice() {
                  try {
                      bluetoothSocket?.close()
                      bluetoothSocket = null
                      isConnected = false
                      statusText.text = "डिवाइस से डिस्कनेक्ट हो गए"
                      btnConnect.text = "दोबारा कनेक्ट करें"
                  } catch (e: IOException) {}
              }

              private fun toggleMute() {
                  if (!isConnected) return
                  isMuted = !isMuted
                  val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager
                  audioManager.isMicrophoneMute = isMuted
                  btnMute.text = if (isMuted) "🔇 म्यूट" else "🔊 म्यूट नहीं"
              }

              private fun toggleSpeaker() {
                  if (!isConnected) return
                  isOnSpeaker = !isOnSpeaker
                  val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager
                  audioManager.isSpeakerphoneOn = isOnSpeaker
                  btnSpeaker.text = if (isOnSpeaker) "🔉 स्पीकर ऑन" else "🔈 स्पीकर ऑफ"
              }

              private fun endCall() {
                  disconnectDevice()
                  finish()
              }
              
              override fun onDestroy() {
                  super.onDestroy()
                  try { bluetoothSocket?.close() } catch (e: IOException) {}
              }
          }
          KOTLIN_EOF

      - name: 9. Write AndroidManifest.xml (All Advanced Permissions Added)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://tools.xmlns.com/tools">

              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.bluetooth" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:debuggable="true"
                  android:icon="@drawable/ic_app_logo"
                  android:label="BT Caller Pro"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar"
                  tools:targetApi="31">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.CallActivity"
                      android:exported="false"
                      android:label="कॉल सक्रिय" />

              </application>

          </manifest>
          MANIFEST_EOF

      - name: 10. Write strings.xml (Resources)
        run: |
          cat > app/src/main/res/values/strings.xml << 'STRINGS_EOF'
          <resources>
              <string name="app_name">BT Caller Pro</string>
          </resources>
          STRINGS_EOF

      - name: 11. Create proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'PROGUARD_EOF'
          -keep class com.example.btcaller.** { *; }
          -keepclassmembers class com.example.btcaller.** { *; }
          -dontwarn com.example.btcaller.**
          -keep class androidx.** { *; }
          PROGUARD_EOF

      - name: 12. Setup Gradle (Official Action)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 13. Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: 14. Upload Professional Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCaller-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
