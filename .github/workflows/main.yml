name: Build Bluetooth Calling App (Complete One File)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Create Complete Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/btcaller/{ui,utils}
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          
          echo "pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'" > settings.gradle
          
          echo "android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true" > gradle.properties

      - name: 5. Write Root build.gradle
        run: |
          cat > build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          GRADLE_EOF

      - name: 6. Write App build.gradle (Complete)
        run: |
          cat > app/build.gradle << 'GRADLE_EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.example.btcaller'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.btcaller'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              buildFeatures {
                  viewBinding false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
          }
          GRADLE_EOF

      - name: 7. Write MainActivity.kt (Bluetooth Discovery)
        run: |
          cat > app/src/main/java/com/example/btcaller/ui/MainActivity.kt << 'KOTLIN_EOF'
          package com.example.btcaller.ui

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.ListView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private val discoveredDevices = ArrayList<BluetoothDevice>()
              private val deviceNames = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>

              private val PERMISSION_REQUEST_CODE = 101

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = android.widget.LinearLayout(this).apply {
                      orientation = android.widget.LinearLayout.VERTICAL
                      padding = 50
                  }

                  val btnScan = Button(this).apply {
                      text = "आस-पास के डिवाइस खोजें"
                      textSize = 16f
                      height = 120
                  }

                  val listView = ListView(this)
                  
                  layout.addView(btnScan)
                  layout.addView(listView, android.widget.LinearLayout.LayoutParams(
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      1f
                  ))
                  setContentView(layout)

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceNames)
                  listView.adapter = listAdapter

                  val bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager.adapter

                  if (bluetoothAdapter == null) {
                      Toast.makeText(this, "इस डिवाइस में ब्लूटूथ उपलब्ध नहीं है", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }

                  if (bluetoothAdapter?.isEnabled == false) {
                      val enableBtIntent = Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              startActivity(enableBtIntent)
                          }
                      } else {
                          startActivity(enableBtIntent)
                      }
                  }

                  btnScan.setOnClickListener {
                      if (checkAndRequestPermissions()) {
                          startScanning()
                      }
                  }

                  listView.setOnItemClickListener { _, _, position, _ ->
                      val device = discoveredDevices[position]
                      Toast.makeText(this, "कनेक्ट कर रहे हैं: ${device.name ?: device.address}", Toast.LENGTH_SHORT).show()
                      
                      val intent = Intent(this, CallActivity::class.java).apply {
                          putExtra("device_address", device.address)
                          putExtra("device_name", device.name ?: "Unknown Device")
                      }
                      startActivity(intent)
                  }

                  val filter = IntentFilter(BluetoothDevice.ACTION_FOUND)
                  registerReceiver(receiver, filter)
              }

              private fun startScanning() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      discoveredDevices.clear()
                      deviceNames.clear()
                      listAdapter.notifyDataSetChanged()
                      
                      if (bluetoothAdapter?.isDiscovering == true) {
                          bluetoothAdapter?.cancelDiscovery()
                      }
                      bluetoothAdapter?.startDiscovery()
                      Toast.makeText(this, "डिवाइस खोजना शुरू...", Toast.LENGTH_SHORT).show()
                  }
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      val action: String? = intent.action
                      if (BluetoothDevice.ACTION_FOUND == action) {
                          val device: BluetoothDevice? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                          }
                          
                          if (device != null && !discoveredDevices.contains(device)) {
                              if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                                  discoveredDevices.add(device)
                                  val name = device.name ?: "Unknown Device"
                                  deviceNames.add("$name\n${device.address}")
                                  listAdapter.notifyDataSetChanged()
                              }
                          }
                      }
                  }
              }

              private fun checkAndRequestPermissions(): Boolean {
                  val permissions = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      arrayOf(
                          Manifest.permission.BLUETOOTH_SCAN,
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      )
                  } else {
                      arrayOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  }

                  val listPermissionsNeeded = ArrayList<String>()
                  for (p in permissions) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          listPermissionsNeeded.add(p)
                      }
                  }

                  if (listPermissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, listPermissionsNeeded.toTypedArray(), PERMISSION_REQUEST_CODE)
                      return false
                  }
                  return true
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          startScanning()
                      } else {
                          Toast.makeText(this, "परमिशन देनी जरूरी है", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(receiver)
                  } catch (e: Exception) {
                  }
              }
          }
          KOTLIN_EOF

      - name: 8. Write CallActivity.kt (Call Management)
        run: |
          cat > app/src/main/java/com/example/btcaller/ui/CallActivity.kt << 'KOTLIN_EOF'
          package com.example.btcaller.ui

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothSocket
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.util.UUID

          class CallActivity : AppCompatActivity() {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var bluetoothSocket: BluetoothSocket? = null
              private var device: BluetoothDevice? = null
              private var isConnected = false
              private var isMuted = false
              private var isOnSpeaker = false

              private lateinit var statusText: TextView
              private lateinit var btnConnect: Button
              private lateinit var btnMute: Button
              private lateinit var btnSpeaker: Button
              private lateinit var btnEndCall: Button

              private val SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      padding = 50
                  }

                  statusText = TextView(this).apply {
                      text = "डिवाइस से कनेक्ट हो रहे हैं..."
                      textSize = 18f
                  }

                  btnConnect = Button(this).apply {
                      text = "कनेक्ट करें"
                      textSize = 14f
                      height = 100
                  }

                  btnMute = Button(this).apply {
                      text = "🔊 म्यूट नहीं"
                      textSize = 14f
                      height = 100
                  }

                  btnSpeaker = Button(this).apply {
                      text = "🔈 स्पीकर"
                      textSize = 14f
                      height = 100
                  }

                  btnEndCall = Button(this).apply {
                      text = "कॉल समाप्त करें"
                      textSize = 14f
                      height = 100
                  }

                  layout.addView(statusText)
                  layout.addView(btnConnect)
                  layout.addView(btnMute)
                  layout.addView(btnSpeaker)
                  layout.addView(btnEndCall)

                  setContentView(layout)

                  val bluetoothManager = getSystemService(BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager.adapter

                  val deviceAddress = intent.getStringExtra("device_address")
                  val deviceName = intent.getStringExtra("device_name")

                  if (deviceAddress != null) {
                      device = bluetoothAdapter?.getRemoteDevice(deviceAddress)
                      statusText.text = "डिवाइस: $deviceName\nस्टेटस: तैयार"
                      btnConnect.performClick()
                  }

                  btnConnect.setOnClickListener {
                      if (isConnected) {
                          disconnectDevice()
                      } else {
                          connectDevice()
                      }
                  }

                  btnMute.setOnClickListener {
                      toggleMute()
                  }

                  btnSpeaker.setOnClickListener {
                      toggleSpeaker()
                  }

                  btnEndCall.setOnClickListener {
                      endCall()
                  }
              }

              private fun connectDevice() {
                  if (device == null) {
                      Toast.makeText(this, "डिवाइस नहीं मिला", Toast.LENGTH_SHORT).show()
                      return
                  }

                  Thread {
                      try {
                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              return@Thread
                          }

                          bluetoothSocket = device?.createRfcommSocketToServiceRecord(SPP_UUID)

                          if (bluetoothSocket != null) {
                              bluetoothAdapter?.cancelDiscovery()
                              bluetoothSocket?.connect()

                              isConnected = true
                              runOnUiThread {
                                  statusText.text = "✓ कनेक्टेड\nकॉल सक्रिय है..."
                                  btnConnect.text = "डिस्कनेक्ट करें"
                                  Toast.makeText(this@CallActivity, "कनेक्ट हो गए!", Toast.LENGTH_SHORT).show()
                              }
                          }
                      } catch (e: IOException) {
                          isConnected = false
                          runOnUiThread {
                              statusText.text = "✕ कनेक्शन विफल\n${e.message}"
                              Toast.makeText(this@CallActivity, "कनेक्शन विफल: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.start()
              }

              private fun disconnectDevice() {
                  try {
                      if (bluetoothSocket != null) {
                          bluetoothSocket?.close()
                          bluetoothSocket = null
                      }
                      isConnected = false
                      statusText.text = "डिवाइस से डिस्कनेक्ट हो गए"
                      btnConnect.text = "दोबारा कनेक्ट करें"
                  } catch (e: IOException) {
                      Toast.makeText(this, "डिस्कनेक्ट त्रुटि: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleMute() {
                  if (!isConnected) {
                      Toast.makeText(this, "पहले कनेक्ट करें", Toast.LENGTH_SHORT).show()
                      return
                  }

                  isMuted = !isMuted
                  val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager

                  if (isMuted) {
                      audioManager.isMicrophoneMute = true
                      btnMute.text = "🔇 म्यूट"
                      Toast.makeText(this, "माइक म्यूट हो गया", Toast.LENGTH_SHORT).show()
                  } else {
                      audioManager.isMicrophoneMute = false
                      btnMute.text = "🔊 म्यूट नहीं"
                      Toast.makeText(this, "माइक सक्रिय", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleSpeaker() {
                  if (!isConnected) {
                      Toast.makeText(this, "पहले कनेक्ट करें", Toast.LENGTH_SHORT).show()
                      return
                  }

                  isOnSpeaker = !isOnSpeaker
                  val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager

                  if (isOnSpeaker) {
                      audioManager.isSpeakerphoneOn = true
                      btnSpeaker.text = "🔉 स्पीकर ऑन"
                      Toast.makeText(this, "स्पीकर ऑन", Toast.LENGTH_SHORT).show()
                  } else {
                      audioManager.isSpeakerphoneOn = false
                      btnSpeaker.text = "🔈 स्पीकर ऑफ"
                      Toast.makeText(this, "स्पीकर ऑफ", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun endCall() {
                  disconnectDevice()
                  statusText.text = "कॉल समाप्त हुआ"
                  Toast.makeText(this, "कॉल ख़त्म", Toast.LENGTH_SHORT).show()
                  
                  Thread {
                      Thread.sleep(1000)
                      finish()
                  }.start()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      if (bluetoothSocket != null) {
                          bluetoothSocket?.close()
                      }
                  } catch (e: IOException) {
                      e.printStackTrace()
                  }
              }
          }
          KOTLIN_EOF

      - name: 9. Write BluetoothManager.kt (Helper)
        run: |
          cat > app/src/main/java/com/example/btcaller/utils/BluetoothManager.kt << 'KOTLIN_EOF'
          package com.example.btcaller.utils

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothSocket
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.util.UUID

          class BluetoothManager(private val context: Context) {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var bluetoothSocket: BluetoothSocket? = null
              private var isConnected = false

              private val SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              fun init(adapter: BluetoothAdapter) {
                  bluetoothAdapter = adapter
              }

              fun isBluetoothEnabled(): Boolean {
                  return bluetoothAdapter?.isEnabled == true
              }

              fun enableBluetooth() {
                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.enable()
                  }
              }

              fun startDiscovery(): Boolean {
                  return if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      if (bluetoothAdapter?.isDiscovering == true) {
                          bluetoothAdapter?.cancelDiscovery()
                      }
                      bluetoothAdapter?.startDiscovery() == true
                  } else {
                      false
                  }
              }

              fun stopDiscovery() {
                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.cancelDiscovery()
                  }
              }

              fun getPairedDevices(): List<BluetoothDevice> {
                  return if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.bondedDevices?.toList() ?: emptyList()
                  } else {
                      emptyList()
                  }
              }

              fun connectToDevice(device: BluetoothDevice, callback: (Boolean, String) -> Unit) {
                  Thread {
                      try {
                          if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              callback(false, "परमिशन नहीं है")
                              return@Thread
                          }

                          bluetoothSocket = device.createRfcommSocketToServiceRecord(SPP_UUID)
                          bluetoothAdapter?.cancelDiscovery()
                          bluetoothSocket?.connect()

                          isConnected = true
                          callback(true, "कनेक्ट हो गए")
                      } catch (e: IOException) {
                          isConnected = false
                          callback(false, "कनेक्शन विफल: ${e.message}")
                      }
                  }.start()
              }

              fun disconnectDevice() {
                  try {
                      bluetoothSocket?.close()
                      bluetoothSocket = null
                      isConnected = false
                  } catch (e: IOException) {
                      e.printStackTrace()
                  }
              }

              fun isConnected(): Boolean = isConnected

              fun sendData(data: String): Boolean {
                  return try {
                      if (isConnected && bluetoothSocket != null) {
                          val outputStream = bluetoothSocket?.outputStream
                          outputStream?.write(data.toByteArray())
                          outputStream?.flush()
                          true
                      } else {
                          false
                      }
                  } catch (e: IOException) {
                          false
                  }
              }
          }
          KOTLIN_EOF

