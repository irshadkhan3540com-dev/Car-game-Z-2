name: "Z+ MP3 Music - Premium Edition + Z Menu"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: "1 ▸ Checkout Code"
        uses: actions/checkout@v4

      - name: "2 ▸ Java 17 Setup"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "3 ▸ Setup NDK & CMake (For C++ Engine)"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: "4 ▸ Create Premium Directory Structure"
        run: |
          mkdir -p app/src/main/java/com/zatomic/mp3engine
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

      - name: "5 ▸ Gradle Project Files & Wrapper Setup"
        run: |
          # Step-by-step creating server properties to fix AndroidX Error
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZPlusMP3Music"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'com.android.application' version '8.3.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: "6 ▸ App build.gradle"
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.zatomic.mp3engine'
            compileSdk 34
            ndkVersion '26.1.10909125'
            defaultConfig {
              applicationId 'com.zatomic.mp3engine'
              minSdk 26
              targetSdk 34
              versionCode 3
              versionName "3.0-PremiumEngine"
              externalNativeBuild {
                cmake { cppFlags "-std=c++17" }
              }
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { viewBinding true }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.3.0'
            implementation 'androidx.media3:media3-session:1.3.0'
            implementation 'androidx.media3:media3-ui:1.3.0'
          }
          EOF

      - name: "7 ▸ C++ Audio Engine Setup (Native Code)"
        run: |
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("torchengine")
          add_library(torchengine SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(torchengine ${log-lib})
          EOF

          cat << 'EOF' > app/src/main/cpp/native-lib.cpp
          #include <jni.h>
          #include <cmath>
          #include <android/log.h>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "TorchEngine_C++", __VA_ARGS__)
          #ifndef M_PI
          #define M_PI 3.14159265358979323846f
          #endif

          enum BeamMode { SPOT_5_DEG, TORCH_20_DEG, FLOOD_60_DEG };

          class TorchAudioEngine {
          private:
              BeamMode currentMode;
              float driveFactor;
              float focusFrequency;
              int sampleRate;
              int preSweepSamples;
              int globalSampleCounter;
              bool isPlaybackStarted;
              float filterState1;

              float applyTrapezoidalShape(float sample) { return std::tanh(sample * driveFactor); }
              float applyTransientFocus(float sample) {
                  float out = sample * focusFrequency + (filterState1 * 0.1f);
                  filterState1 = sample; 
                  return out;
              }
              float generatePreSweepSignal(int sampleIndex) {
                  float frequency = 15000.0f;
                  float t = (float)sampleIndex / (float)sampleRate;
                  float amplitudeEnvelope = std::sin(((float)sampleIndex / preSweepSamples) * M_PI) * 0.15f; 
                  return std::sin(2.0f * M_PI * frequency * t) * amplitudeEnvelope;
              }
          public:
              TorchAudioEngine(int sRate = 44100) {
                  sampleRate = sRate;
                  preSweepSamples = (int)(0.2f * sampleRate);
                  globalSampleCounter = 0;
                  filterState1 = 0.0f;
                  isPlaybackStarted = false;
                  setBeamMode(TORCH_20_DEG); 
              }
              void resetPlayback() {
                  globalSampleCounter = 0;
                  isPlaybackStarted = true;
                  filterState1 = 0.0f;
              }
              void setBeamMode(BeamMode mode) {
                  currentMode = mode;
                  switch (mode) {
                      case SPOT_5_DEG: driveFactor = 4.0f; focusFrequency = 1.8f; break;
                      case TORCH_20_DEG: driveFactor = 2.5f; focusFrequency = 1.3f; break;
                      case FLOOD_60_DEG: driveFactor = 1.0f; focusFrequency = 1.0f; break;
                  }
              }
              void processAudio(float* buffer, int numFrames) {
                  for (int i = 0; i < numFrames; ++i) {
                      if (isPlaybackStarted && globalSampleCounter < preSweepSamples) {
                          buffer[i] = generatePreSweepSignal(globalSampleCounter);
                          globalSampleCounter++;
                          continue; 
                      } else { isPlaybackStarted = false; }

                      float sample = buffer[i];
                      sample = applyTransientFocus(sample);
                      sample = applyTrapezoidalShape(sample);
                      if (sample > 1.0f) sample = 1.0f;
                      if (sample < -1.0f) sample = -1.0f;
                      buffer[i] = sample;
                      globalSampleCounter++;
                  }
              }
          };

          TorchAudioEngine* engine = nullptr;

          extern "C" JNIEXPORT void JNICALL
          Java_com_zatomic_mp3engine_NativeEngine_initEngine(JNIEnv* env, jobject thiz, jint sampleRate) {
              if (engine != nullptr) delete engine;
              engine = new TorchAudioEngine(sampleRate);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_zatomic_mp3engine_NativeEngine_setMode(JNIEnv* env, jobject thiz, jint mode) {
              if (engine != nullptr) engine->setBeamMode(static_cast<BeamMode>(mode));
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_zatomic_mp3engine_NativeEngine_resetPlayback(JNIEnv* env, jobject thiz) {
              if (engine != nullptr) engine->resetPlayback();
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_zatomic_mp3engine_NativeEngine_processAudioBuffer(JNIEnv* env, jobject thiz, jobject byteBuffer, jint numFrames) {
              if (engine == nullptr) return;
              float* buffer = (float*)env->GetDirectBufferAddress(byteBuffer);
              if (buffer != nullptr) {
                  engine->processAudio(buffer, numFrames);
              }
          }
          EOF

