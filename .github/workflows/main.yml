      - name: 9. Write BluetoothManager.kt (Helper)
        run: |
          cat > app/src/main/java/com/example/btcaller/utils/BluetoothManager.kt << 'KOTLIN_EOF'
          package com.example.btcaller.utils

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothSocket
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.util.UUID

          class BluetoothManager(private val context: Context) {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var bluetoothSocket: BluetoothSocket? = null
              private var isConnected = false

              private val SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              fun init(adapter: BluetoothAdapter) {
                  bluetoothAdapter = adapter
              }

              fun isBluetoothEnabled(): Boolean {
                  return bluetoothAdapter?.isEnabled == true
              }

              fun enableBluetooth() {
                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.enable()
                  }
              }

              fun startDiscovery(): Boolean {
                  return if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      if (bluetoothAdapter?.isDiscovering == true) {
                          bluetoothAdapter?.cancelDiscovery()
                      }
                      bluetoothAdapter?.startDiscovery() == true
                  } else {
                      false
                  }
              }

              fun stopDiscovery() {
                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.cancelDiscovery()
                  }
              }

              fun getPairedDevices(): List<BluetoothDevice> {
                  return if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED || Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      bluetoothAdapter?.bondedDevices?.toList() ?: emptyList()
                  } else {
                      emptyList()
                  }
              }

              fun connectToDevice(device: BluetoothDevice, callback: (Boolean, String) -> Unit) {
                  Thread {
                      try {
                          if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              callback(false, "à¤ªà¤°à¤®à¤¿à¤¶à¤¨ à¤¨à¤¹à¥€à¤‚ à¤¹à¥ˆ")
                              return@Thread
                          }

                          bluetoothSocket = device.createRfcommSocketToServiceRecord(SPP_UUID)
                          bluetoothAdapter?.cancelDiscovery()
                          bluetoothSocket?.connect()

                          isConnected = true
                          callback(true, "à¤•à¤¨à¥‡à¤•à¥à¤Ÿ à¤¹à¥‹ à¤—à¤")
                      } catch (e: IOException) {
                          isConnected = false
                          callback(false, "à¤•à¤¨à¥‡à¤•à¥à¤¶à¤¨ à¤µà¤¿à¤«à¤²: ${e.message}")
                      }
                  }.start()
              }

              fun disconnectDevice() {
                  try {
                      bluetoothSocket?.close()
                      bluetoothSocket = null
                      isConnected = false
                  } catch (e: IOException) {
                      e.printStackTrace()
                  }
              }

              fun isConnected(): Boolean = isConnected

              fun sendData(data: String): Boolean {
                  return try {
                      if (isConnected && bluetoothSocket != null) {
                          val outputStream = bluetoothSocket?.outputStream
                          outputStream?.write(data.toByteArray())
                          outputStream?.flush()
                          true
                      } else {
                          false
                      }
                  } catch (e: IOException) {
                      false
                  }
              }
          }
          KOTLIN_EOF

