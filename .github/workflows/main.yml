name: "Ultimate 500% Volume Video Player Engine"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout Repository"
        uses: actions/checkout@v4

      - name: "Step 2: Setup Java 17 for Android Compiler"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Step 3: Auto-Accept Android SDK Licenses"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: "Step 4: Create Video Engine Directory Folders"
        run: |
          mkdir -p app/src/main/java/com/zatomic/videoengine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

      - name: "Step 5: Gradle Build System Configuration"
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "UltimateVideoEngine"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.3.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }
          EOF
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          
          gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: "Step 6: App Custom Full Screen Layout & Style XMLs"
        run: |
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="player_red">#E50914</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.VideoEngine" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/black">
              
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_centerInParent="true"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_alignParentBottom="true"
                  android:background="#99000000"
                  android:padding="15dp">
                  
                  <Button android:id="@+id/btnSelectMovie" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🎬 OPEN MOVIE" />
                  <Button android:id="@+id/btnAudioBoost" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🔊 BOOST 500%" android:layout_marginHorizontal="8dp" android:backgroundTint="@color/player_red"/>
                  <Button android:id="@+id/btnFitScreen" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="📱 FULL SCREEN" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          
          # Fix: Added requestLegacyExternalStorage to bypass strict file limitations
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              
              <application android:label="VIP Video Engine" android:icon="@android:drawable/ic_menu_slideshow" android:theme="@style/Theme.VideoEngine" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: "Step 7: Inject Google Media3 Core Dependencies"
        run: |
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.zatomic.videoengine'
              compileSdk 34
              defaultConfig { applicationId 'com.zatomic.videoengine'; minSdk 26; targetSdk 34; versionCode 2; versionName "2.0-PRO" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-session:1.3.0'
          }
          EOF

      - name: "Step 8: Write Permission-Enabled Engine Logic (Kotlin)"
        run: |
          cat << 'EOF' > app/src/main/java/com/zatomic/videoengine/MainActivity.kt
          package com.zatomic.videoengine
          import android.Manifest
          import android.content.pm.PackageManager
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private var loudnessEnhancer: LoudnessEnhancer? = null
              private var isBoosted = false
              private var screenMode = 0 

              // SMART PERMISSION LAUNCHER - Never Fails!
              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { permissions ->
                  val granted = permissions.entries.all { it.value }
                  if (granted) {
                      Toast.makeText(this, "System Ready! 🚀 VIP Access Granted.", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Permission Denied. Limited access mode.", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  // 1. Run strict permission scan on startup
                  checkAndRequestPermissions()

                  playerView = findViewById(R.id.playerView)
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player

                  val videoPicker = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                      uri?.let {
                          val mediaItem = MediaItem.fromUri(it)
                          player?.setMediaItem(mediaItem)
                          player?.prepare()
                          player?.play()
                          
                          player?.audioSessionId?.let { sessionId ->
                              if (sessionId != Player.AUDIO_SESSION_ID_UNSET) {
                                  try {
                                      loudnessEnhancer = LoudnessEnhancer(sessionId)
                                  } catch (e: Exception) {
                                      e.printStackTrace() // Crash Prevention
                                  }
                              }
                          }
                      }
                  }

                  findViewById<Button>(R.id.btnSelectMovie).setOnClickListener {
                      videoPicker.launch("video/*")
                  }

                  findViewById<Button>(R.id.btnAudioBoost).setOnClickListener { btn ->
                      val button = btn as Button
                      if (loudnessEnhancer != null) {
                          try {
                              if (!isBoosted) {
                                  loudnessEnhancer?.enabled = true
                                  loudnessEnhancer?.setTargetGain(5000) 
                                  isBoosted = true
                                  button.text = "🔊 BOOST ON (500%)"
                                  Toast.makeText(this, "🔥 Sound Engine at 500% Max Limit!", Toast.LENGTH_SHORT).show()
                              } else {
                                  loudnessEnhancer?.setTargetGain(0)
                                  loudnessEnhancer?.enabled = false
                                  isBoosted = false
                                  button.text = "🔊 BOOST 500%"
                              }
                          } catch (e: Exception) {
                              Toast.makeText(this, "Device limits extreme audio boost.", Toast.LENGTH_SHORT).show()
                          }
                      } else {
                          Toast.makeText(this, "Please play a movie first!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnFitScreen).setOnClickListener { btn ->
                      val button = btn as Button
                      when (screenMode) {
                          0 -> {
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                              screenMode = 1
                              button.text = "📱 ZOOM MODE"
                          }
                          1 -> {
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              screenMode = 2
                              button.text = "📱 STRETCH FILL"
                          }
                          2 -> {
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                              screenMode = 0
                              button.text = "📱 ORIGINAL FIT"
                          }
                      }
                  }
              }

              private fun checkAndRequestPermissions() {
                  val permissionsToRequest = mutableListOf<String>()
                  
                  // Auto-detect Android 13/14 vs Android 12 and below
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsToRequest.add(Manifest.permission.READ_MEDIA_VIDEO)
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          permissionsToRequest.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }

                  if (permissionsToRequest.isNotEmpty()) {
                      permissionLauncher.launch(permissionsToRequest.toTypedArray())
                  } else {
                      Toast.makeText(this, "Engine Armed and Ready! 🎬", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  loudnessEnhancer?.release()
              }
          }
          EOF

      - name: "Step 9: Compile Stable Video Engine Executable Binary"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: "Step 10: Deploy Professional Target Package"
        uses: actions/upload-artifact@v4
        with:
          name: "Ultimate-500Percent-Video-Engine-PRO"
          path: app/build/outputs/apk/debug/app-debug.apk

